[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pressbridge"
version = "1.2.0"
license = "MIT"
description = "Give Claude safe, audited access to your WordPress sites over MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2,<3",
    "PyYAML>=6",
    "uvicorn>=0.30",
    "starlette>=0.40",
]

[project.urls]
Homepage = "https://pressbridgesupport.github.io/pressbridge"
Source = "https://github.com/pressbridgesupport/pressbridge"

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
pressbridge = "pressbridge.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
